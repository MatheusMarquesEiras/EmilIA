[project]
name = "emilia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "emoji>=2.15.0",
    "faster-whisper>=1.2.1",
    "mss>=10.1.0",
    "ollama>=0.6.1",
    "piper-tts>=1.3.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "torch",
    "torchvision",
    "torchaudio",
    "mutagen>=1.47.0",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
