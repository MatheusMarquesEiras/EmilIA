services:
  ollama-1:
    image: ollama/ollama:latest
    container_name: ollama-1
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ../../storage/backup-1:/root/.ollama
      - ../../model:/root/context
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 'all' permite que ambos acessem a GPU sem reserva exclusiva
              count: all
              capabilities: [gpu]

